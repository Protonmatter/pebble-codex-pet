name: Validate Pebble Pet

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --require-hashes --requirement requirements.txt

      - name: Run adversarial and regression tests
        run: python -m unittest discover --start-directory tests --verbose

      # Validate the asset that is actually committed and shipped, before any
      # rebuild can overwrite it.
      - name: Verify committed sprite atlas
        run: python scripts/verify_pebble_pose_pet.py pebble-poses qa/validation.json

      # Reproducibility gate: rebuild from source into an isolated directory
      # (leaving the committed assets untouched), verify it, and compare every
      # generated artifact semantically with the committed version.
      - name: Rebuild assets in an isolated directory
        run: |
          python scripts/build_pebble_pose_pet.py \
            --out-dir build/repro/pebble-poses \
            --poses-dir build/repro/source/poses \
            --contact-sheet build/repro/preview/pebble-poses-contact-sheet.png \
            --gif build/repro/preview/pebble-poses-animation-preview.gif \
            --rows-dir build/repro/preview/rows \
            --animation-map build/repro/docs/animation-map.json

      - name: Verify the rebuilt atlas
        run: python scripts/verify_pebble_pose_pet.py build/repro/pebble-poses

      - name: Compare committed and rebuilt outputs
        run: python scripts/compare_build_outputs.py . build/repro

      # Packages the committed (already-verified) runtime asset.
      - name: Package releases
        run: python scripts/package_release.py

      - name: Upload validation and release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pebble-poses-build
          path: |
            qa/validation.json
            dist/pebble-poses-runtime.zip
            dist/pebble-poses-source.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
