name: Validate Pebble Pet

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Rebuild assets
        run: python scripts/build_pebble_pose_pet.py

      - name: Validate sprite atlas
        run: python scripts/verify_pebble_pose_pet.py pebble-poses qa/validation.json

      - name: Package releases
        run: python scripts/package_release.py

      - name: Upload validation and release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pebble-poses-build
          path: |
            qa/validation.json
            dist/pebble-poses-runtime.zip
            dist/pebble-poses-source.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
